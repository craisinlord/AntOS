plugins { id 'net.neoforged.moddev' }

base { archivesName = "antos-neoforge-26.3" }

def generatedVersionSource = layout.buildDirectory.file('generated/sources/antosVersion/java/com/craisinlord/antos/AntOSBuildVersion.java')
tasks.register('generateAntOSVersion') {
    inputs.property 'version', project.version
    outputs.file generatedVersionSource
    doLast {
        def sourceFile = generatedVersionSource.get().asFile
        sourceFile.parentFile.mkdirs()
        sourceFile.text = "package com.craisinlord.antos;\n\npublic final class AntOSBuildVersion {\n    public static final String VALUE = \"${project.version}\";\n\n    private AntOSBuildVersion() {}\n}\n"
    }
}
sourceSets.main.java.srcDir(generatedVersionSource.map { it.asFile.parentFile })
tasks.named('compileJava') { dependsOn tasks.named('generateAntOSVersion') }
tasks.named('sourcesJar') { dependsOn tasks.named('generateAntOSVersion') }

java {
    toolchain { languageVersion = JavaLanguageVersion.of(25) }
    withSourcesJar()
}

sourceSets.main {
    java.srcDirs += project(':common-26.3').sourceSets.main.java.srcDirs
    resources.srcDirs += project(':common-26.3').sourceSets.main.resources.srcDirs
}

neoForge {
    version = neoforge_version_26_3
    mods {
        create('antos') { sourceSet sourceSets.main }
    }
    runs {
        client { client() }
        server { server() }
    }
}

dependencies {
    implementation "maven.modrinth:geckolib:${geckolib_modrinth_version_neoforge_26_3}"
    compileOnly "dev.ftb.mods:ftb-quests-neoforge:${ftb_quests_version_26_1}"
    compileOnly "dev.ftb.mods:ftb-library:${ftb_library_version_26_1}"
    compileOnly("dev.ftb.mods:ftb-library-neoforge:${ftb_library_version_26_1}") { transitive = false }
    compileOnly "dev.ftb.mods:ftb-teams:${ftb_teams_version_26_1}"
    compileOnly("dev.ftb.mods:ftb-teams-neoforge:${ftb_teams_version_26_1}") { transitive = false }
    compileOnly "mezz.jei:jei-26.3-neoforge-api:${jei_version_26_3}"
    runtimeOnly("mezz.jei:jei-26.3-neoforge:${jei_version_26_3}") { transitive = false }
}

tasks.withType(ProcessResources).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    inputs.property 'version', project.version
    inputs.property 'minecraft_version', minecraft_version_26_3
    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: project.version
    }
}

