plugins { id 'dev.architectury.loom' }

base { archivesName = 'antos-fabric-1.21.1' }

java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }

sourceSets.main {
    java.srcDirs += project(':common-1.21.1').sourceSets.main.java.srcDirs
    resources.srcDirs += project(':common-1.21.1').sourceSets.main.resources.srcDirs
}

def generatedVersionSource = layout.buildDirectory.file('generated/sources/antosVersion/java/com/craisinlord/antos/AntOSBuildVersion.java')
tasks.register('generateAntOSVersion') {
    inputs.property 'version', project.version
    outputs.file generatedVersionSource
    doLast {
        def sourceFile = generatedVersionSource.get().asFile
        sourceFile.parentFile.mkdirs()
        sourceFile.text = """package com.craisinlord.antos;

public final class AntOSBuildVersion {
    public static final String VALUE = \"${project.version}\";

    private AntOSBuildVersion() {}
}
"""
    }
}
sourceSets.main.java.srcDir(layout.buildDirectory.dir('generated/sources/antosVersion/java'))
tasks.named('compileJava') { dependsOn tasks.named('generateAntOSVersion') }
tasks.named('sourcesJar') { dependsOn tasks.named('generateAntOSVersion') }

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version_1_21_1}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version_1_21_1}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version_1_21_1}"
    modImplementation "software.bernie.geckolib:geckolib-fabric-1.21.1:${geckolib_version}"
    modCompileOnly "dev.ftb.mods:ftb-quests-fabric:${ftb_quests_version_1_21_1}"
    modCompileOnly("dev.ftb.mods:ftb-library-fabric:${ftb_library_version_1_21_1}") { transitive = false }
    modCompileOnly("dev.ftb.mods:ftb-teams-fabric:${ftb_teams_version_1_21_1}") { transitive = false }
    modCompileOnly "dev.architectury:architectury-fabric:${architectury_version_1_21_1}"
}

def accountTestClasses = layout.buildDirectory.dir('classes/java/accountTest')

tasks.register('compileAccountTests', JavaCompile) {
    dependsOn tasks.named('compileJava')
    source fileTree('../common-1.21.1/src/test/java') { include '**/*.java' }
    classpath = sourceSets.main.compileClasspath + sourceSets.main.output
    destinationDirectory = accountTestClasses
    options.encoding = 'UTF-8'
    options.release = 21
}

tasks.register('accountTest', JavaExec) {
    group = 'verification'
    description = 'Runs automated Anternet account credential tests.'
    dependsOn tasks.named('compileAccountTests')
    classpath = files(accountTestClasses) + sourceSets.main.output + sourceSets.main.compileClasspath
    mainClass = 'com.craisinlord.antos.content.computer.ComputerWorkspaceDataAccountTest'
}

tasks.register('taskAppearanceTest', JavaExec) {
    group = 'verification'
    description = 'Runs task appearance parsing and shape geometry tests.'
    dependsOn 'compileTaskShapeTests'
    classpath = files(layout.buildDirectory.dir('classes/java/taskShapeTest')) + sourceSets.main.compileClasspath
    mainClass = 'com.craisinlord.antos.content.guide.TaskAppearanceTest'
}

tasks.register('compileTaskShapeTests', JavaCompile) {
    source files('../common-1.21.1/src/main/java/com/craisinlord/antos/content/guide/TaskAppearance.java',
            '../common-1.21.1/src/main/java/com/craisinlord/antos/content/client/renderer/TaskShapeRenderer.java',
            '../common-1.21.1/src/test/java/com/craisinlord/antos/content/guide/TaskAppearanceTest.java',
            '../common-1.21.1/src/test/java/com/craisinlord/antos/content/client/renderer/TaskShapeShaderTest.java')
    classpath = sourceSets.main.compileClasspath
    destinationDirectory = layout.buildDirectory.dir('classes/java/taskShapeTest')
    options.encoding = 'UTF-8'
    options.release = 21
}

configurations { taskShapeTestNatives }
def shapeTestOs = System.getProperty('os.name').toLowerCase(java.util.Locale.ROOT)
def shapeTestNative = shapeTestOs.contains('win') ? 'natives-windows' : shapeTestOs.contains('mac') ? 'natives-macos' : 'natives-linux'
if (System.getProperty('os.arch').toLowerCase(java.util.Locale.ROOT).contains('aarch64')) shapeTestNative += '-arm64'
dependencies {
    taskShapeTestNatives "org.lwjgl:lwjgl:3.3.3:${shapeTestNative}"
    taskShapeTestNatives "org.lwjgl:lwjgl-glfw:3.3.3:${shapeTestNative}"
    taskShapeTestNatives "org.lwjgl:lwjgl-opengl:3.3.3:${shapeTestNative}"
}

tasks.register('taskShapeShaderTest', JavaExec) {
    group = 'verification'
    description = 'Compiles and renders task shape shaders in a hidden OpenGL context.'
    dependsOn 'compileTaskShapeTests'
    classpath = files(layout.buildDirectory.dir('classes/java/taskShapeTest')) + sourceSets.main.compileClasspath + configurations.taskShapeTestNatives + files('../common-1.21.1/src/main/resources')
    mainClass = 'com.craisinlord.antos.content.client.renderer.TaskShapeShaderTest'
    args layout.buildDirectory.file('task-shapes-preview.png').get().asFile.absolutePath
}

tasks.register('diskCollectionTest', JavaExec) {
    group = 'verification'
    description = 'Verifies disk collection persistence, profile isolation, and old save migration.'
    dependsOn tasks.named('compileAccountTests')
    classpath = files(accountTestClasses) + sourceSets.main.output + sourceSets.main.compileClasspath
    mainClass = 'com.craisinlord.antos.content.computer.DiskCollectionTest'
    workingDir = layout.buildDirectory.dir('disk-stage-tests').get().asFile
    doFirst { workingDir.mkdirs() }
}

tasks.register('diskDefinitionTest', JavaExec) {
    group = 'verification'
    description = 'Verifies backward compatible disk definitions and Library metadata.'
    dependsOn tasks.named('compileAccountTests')
    classpath = files(accountTestClasses) + sourceSets.main.output + sourceSets.main.compileClasspath
    mainClass = 'com.craisinlord.antos.content.guide.DiskDefinitionTest'
    workingDir = layout.buildDirectory.dir('disk-stage-tests').get().asFile
    doFirst { workingDir.mkdirs() }
}

tasks.register('antazonDiskUnlockTest', JavaExec) {
    group = 'verification'
    description = 'Verifies mixed task and disk requirements and unlock notification transitions.'
    dependsOn tasks.named('compileAccountTests')
    classpath = files(accountTestClasses) + sourceSets.main.output + sourceSets.main.compileClasspath
    mainClass = 'com.craisinlord.antos.content.antazon.AntazonDiskUnlockTest'
    workingDir = layout.buildDirectory.dir('disk-stage-tests').get().asFile
    doFirst { workingDir.mkdirs() }
}
tasks.register('diskEngineTest', JavaExec) {
    group = 'verification'
    description = 'Verifies disk activation, files, encryption, programs, and subscriptions.'
    dependsOn tasks.named('compileAccountTests')
    classpath = files(accountTestClasses) + sourceSets.main.output + sourceSets.main.compileClasspath
    mainClass = 'com.craisinlord.antos.content.computer.DiskEngineTest'
    args rootProject.projectDir.absolutePath
    workingDir = layout.buildDirectory.dir('disk-stage-tests').get().asFile
    doFirst { workingDir.mkdirs() }
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand 'version': project.version }
}
