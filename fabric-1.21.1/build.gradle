plugins { id 'net.fabricmc.fabric-loom-remap' }

base { archivesName = 'antos-fabric-1.21.1' }

java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }

sourceSets.main {
    java.srcDirs += project(':common-1.21.1').sourceSets.main.java.srcDirs
    resources.srcDirs += project(':common-1.21.1').sourceSets.main.resources.srcDirs
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version_1_21_1}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version_1_21_1}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version_1_21_1}"
    modImplementation "software.bernie.geckolib:geckolib-fabric-1.21.1:${geckolib_version}"
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand 'version': project.version }
}
