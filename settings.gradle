pluginManagement {
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.architectury.dev/' }
        maven { url = 'https://maven.neoforged.net/releases' }
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        maven { url = 'https://plugins.gradle.org/m2/' }
        maven { url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' }
        gradlePluginPortal()
        mavenCentral()
    }
    plugins {
        id 'dev.architectury.loom' version '1.17.493'
        id 'net.fabricmc.fabric-loom' version '1.17.19'
        id 'net.neoforged.moddev' version '2.0.148'
    }
}

rootProject.name = 'AntOS'

include 'common-1.21.1'
include 'fabric-1.21.1'
include 'neoforge-1.21.1'
include 'common-1.20.1'
include 'common-26.1'
include 'fabric-26.1'
include 'neoforge-26.1'
include 'common-26.2'
include 'fabric-26.2'
include 'neoforge-26.2'
include 'common-26.3'
include 'fabric-26.3'
include 'neoforge-26.3'
