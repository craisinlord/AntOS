plugins {
    id 'java-library'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
    id 'org.spongepowered.mixin' version '0.7.+'
}

group = mod_group_id
version = mod_version

java {
    toolchain { languageVersion = JavaLanguageVersion.of(17) }
    withSourcesJar()
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.minecraftforge.net' }
    maven { url = 'https://maven.parchmentmc.org' }
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    maven { url = 'https://maven.ftb.dev/releases' }
    maven { url = 'https://maven.architectury.dev/' }
    maven {
        url = 'https://maven.blamejared.com/'
        content { includeGroup 'mezz.jei' }
    }
    maven {
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content { includeGroup 'software.bernie.geckolib' }
    }
}

base { archivesName = 'antos-forge-1.20.1' }

def generatedVersionSource = layout.buildDirectory.file('generated/sources/antosVersion/java/com/craisinlord/antos/AntOSBuildVersion.java')
tasks.register('generateAntOSVersion') {
    inputs.property 'version', project.version
    outputs.file generatedVersionSource
    doLast {
        def sourceFile = generatedVersionSource.get().asFile
        sourceFile.parentFile.mkdirs()
        sourceFile.text = "package com.craisinlord.antos;\n\npublic final class AntOSBuildVersion {\n    public static final String VALUE = \"${project.version}\";\n\n    private AntOSBuildVersion() {}\n}\n"
    }
}

sourceSets.main.java.srcDir(layout.buildDirectory.dir('generated/sources/antosVersion/java'))
tasks.named('compileJava') { dependsOn tasks.named('generateAntOSVersion') }
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xmaxerrs', '10000']
}
tasks.named('sourcesJar') { dependsOn tasks.named('generateAntOSVersion') }

tasks.withType(AbstractCopyTask).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

minecraft {
    mappings channel: 'parchment', version: parchment_version
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            mods { antos { source sourceSets.main } }
        }
        client {
            jvmArgs '-Dmixin.env.remapRefMap=true', "-Dmixin.env.refMapRemappingFile=${projectDir}/build/createSrgToMcp/output.srg"
        }
        server {
            jvmArgs '-Dmixin.env.remapRefMap=true', "-Dmixin.env.refMapRemappingFile=${projectDir}/build/createSrgToMcp/output.srg"
            args '--nogui'
        }
    }
}

sourceSets {
    main {
        java.srcDirs += file('../common-1.20.1/src/main/java')
        resources.srcDirs += file('../common-1.20.1/src/main/resources')
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    implementation fg.deobf("software.bernie.geckolib:geckolib-forge-${minecraft_version}:${geckolib_version}")
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    compileOnly "dev.ftb.mods:ftb-quests-forge:2001.4.22"
    compileOnly("dev.ftb.mods:ftb-library-forge:2001.2.13") { transitive = false }
    compileOnly("dev.ftb.mods:ftb-teams-forge:2001.3.2") { transitive = false }
    compileOnly "dev.architectury:architectury-forge:9.2.14"
    compileOnly fg.deobf("mezz.jei:jei-${minecraft_version}-common-api:${jei_version}")
    compileOnly fg.deobf("mezz.jei:jei-${minecraft_version}-forge-api:${jei_version}")
    runtimeOnly fg.deobf("mezz.jei:jei-${minecraft_version}-forge:${jei_version}")
}

mixin {
    add sourceSets.main, 'geckolib.refmap.json'
    config 'geckolib.mixins.json'
}

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [version: project.version, forge_version_range: forge_version_range,
                             loader_version_range: loader_version_range, minecraft_version: minecraft_version]
    inputs.properties replaceProperties
    filesMatching('META-INF/mods.toml') { expand replaceProperties }
}

tasks.named('jar', Jar).configure { finalizedBy 'reobfJar' }

def displayTestClasses = layout.buildDirectory.dir('classes/java/displayTest')

tasks.register('compileDisplayTests', JavaCompile) {
    dependsOn tasks.named('compileJava')
    source files(
            '../common-1.20.1/src/test/java/com/craisinlord/antos/content/guide/DisplayFeaturesTest.java',
            '../common-1.20.1/src/test/java/com/craisinlord/antos/content/guide/DisplayRecipesTest.java',
            '../common-1.20.1/src/test/java/com/craisinlord/antos/content/guide/CustomDisplaysTest.java',
            '../common-1.20.1/src/test/java/com/craisinlord/antos/content/client/screen/ArchiveFolderTest.java')
    classpath = sourceSets.main.compileClasspath + sourceSets.main.output
    destinationDirectory = displayTestClasses
    options.encoding = 'UTF-8'
    options.release = 17
}

[
    displayFeaturesTest: [testClass: 'com.craisinlord.antos.content.guide.DisplayFeaturesTest', withRoot: false, dir: 'custom-display-tests',
                          description: 'Verifies display materials, steps, layouts, variants, indexing, presets, and adapter registration.'],
    displayRecipesTest: [testClass: 'com.craisinlord.antos.content.guide.DisplayRecipesTest', withRoot: true, dir: 'custom-display-tests',
                         description: 'Verifies vanilla recipe extraction, reload behavior, and all custom display examples.'],
    customDisplaysTest: [testClass: 'com.craisinlord.antos.content.guide.CustomDisplaysTest', withRoot: true, dir: 'custom-display-tests',
                         description: 'Verifies custom display validation, templates, structures, and synchronization.'],
    archiveFolderTest: [testClass: 'com.craisinlord.antos.content.client.screen.ArchiveFolderTest', withRoot: false, dir: 'archive-folder-tests',
                        description: 'Verifies Archive folder sync, unlocking, ordering, search, and navigation.']
].each { name, test ->
    tasks.register(name, JavaExec) {
        group = 'verification'
        description = test.description
        dependsOn tasks.named('compileDisplayTests')
        classpath = files(displayTestClasses) + sourceSets.main.output + sourceSets.main.runtimeClasspath
        mainClass = test.testClass
        if (test.withRoot) args file('..').absolutePath
        workingDir = layout.buildDirectory.dir(test.dir).get().asFile
        doFirst { workingDir.mkdirs() }
    }
}



def taskPinsTestClasses = layout.buildDirectory.dir('classes/java/taskPinsTest')

tasks.register('compileTaskPinsTests', JavaCompile) {
    dependsOn tasks.named('compileJava')
    source files('../common-1.20.1/src/test/java/com/craisinlord/antos/content/computer/TaskPinsAndClaimsTest.java')
    classpath = sourceSets.main.compileClasspath + sourceSets.main.output
    destinationDirectory = taskPinsTestClasses
    options.encoding = 'UTF-8'
    options.release = 17
}

tasks.register('taskPinsAndClaimsTest', JavaExec) {
    group = 'verification'
    description = 'Verifies pinned task storage and Claim All reward crate packing.'
    dependsOn tasks.named('compileTaskPinsTests')
    classpath = files(taskPinsTestClasses) + sourceSets.main.output + sourceSets.main.runtimeClasspath
    mainClass = 'com.craisinlord.antos.content.computer.TaskPinsAndClaimsTest'
}

def merchantTestClasses = layout.buildDirectory.dir('classes/java/merchantTest')

tasks.register('compileMerchantTests', JavaCompile) {
    dependsOn tasks.named('compileJava')
    source fileTree('../common-1.20.1/src/test/java/com/craisinlord/antos/content/merchant') { include '**/*.java' }
    classpath = sourceSets.main.compileClasspath + sourceSets.main.output
    destinationDirectory = merchantTestClasses
    options.encoding = 'UTF-8'
    options.release = 17
}

tasks.register('merchantTest', JavaExec) {
    group = 'verification'
    dependsOn tasks.named('compileMerchantTests')
    classpath = files(merchantTestClasses) + sourceSets.main.output + sourceSets.main.runtimeClasspath
    mainClass = 'com.craisinlord.antos.content.merchant.MerchantStoreTest'
    args '--rules-only'
}

def configTestClasses = layout.buildDirectory.dir('classes/java/configTest')

tasks.register('compileConfigTests', JavaCompile) {
    dependsOn tasks.named('compileJava')
    source files('../common-1.20.1/src/test/java/com/craisinlord/antos/config/NotificationHistoryTest.java',
            '../common-1.20.1/src/test/java/com/craisinlord/antos/config/DesktopPreferencesTest.java',
            '../common-1.20.1/src/test/java/com/craisinlord/antos/content/client/screen/DesktopQolAuditTest.java',
            '../common-1.20.1/src/test/java/com/craisinlord/antos/content/client/screen/DesktopViewportTest.java')
    classpath = sourceSets.main.compileClasspath + sourceSets.main.output
    destinationDirectory = configTestClasses
    options.encoding = 'UTF-8'
    options.release = 17
}

tasks.register('notificationHistoryTest', JavaExec) {
    group = 'verification'
    description = 'Verifies notification history storage, read state, and reload.'
    dependsOn tasks.named('compileConfigTests')
    classpath = files(configTestClasses) + sourceSets.main.output + sourceSets.main.runtimeClasspath
    mainClass = 'com.craisinlord.antos.config.NotificationHistoryTest'
}

['desktopPreferencesTest': 'com.craisinlord.antos.config.DesktopPreferencesTest',
 'desktopQolAuditTest': 'com.craisinlord.antos.content.client.screen.DesktopQolAuditTest',
 'desktopViewportTest': 'com.craisinlord.antos.content.client.screen.DesktopViewportTest'].each { name, testClass ->
    tasks.register(name, JavaExec) {
        group = 'verification'
        description = 'Verifies desktop preferences, draft recovery, and the desktop viewport.'
        dependsOn tasks.named('compileConfigTests')
        classpath = files(configTestClasses) + sourceSets.main.output + sourceSets.main.runtimeClasspath
        mainClass = testClass
    }
}
