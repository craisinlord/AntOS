plugins {
    id 'java-library'
    id 'maven-publish'
}

allprojects {
    apply plugin: 'java-library'
    apply plugin: 'maven-publish'
    group = rootProject.maven_group
    version = rootProject.mod_version

    repositories {
        maven { url 'https://maven.ftb.dev/releases' }
        maven { url 'https://maven.architectury.dev/' }
        maven { url 'https://maven.fabricmc.net/' }
        maven { url 'https://maven.neoforged.net/releases' }
        maven { url 'https://api.modrinth.com/maven' }
        maven { url 'https://cursemaven.com' }
        maven { url 'https://maven.blamejared.com/' }
        maven { url 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' }
        mavenCentral()
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }

    java {
        toolchain { languageVersion = JavaLanguageVersion.of(21) }
        withSourcesJar()
    }
}

tasks.named('jar') { enabled = false }

['build', 'assemble', 'clean', 'runClient', 'runServer'].each { taskName ->
    tasks.register("forge120${taskName.capitalize()}", Exec) {
        group = 'forge-1.20.1'
        description = "Runs '${taskName}' with the Forge 1.20.1 wrapper"
        workingDir = file('forge-1.20.1')
        environment 'GRADLE_USER_HOME', gradle.gradleUserHomeDir.absolutePath
        commandLine file("forge-1.20.1/${providers.systemProperty('os.name').get().toLowerCase().contains('win') ? 'gradlew.bat' : 'gradlew'}").absolutePath, taskName
    }
}

[
    fabric121: [projectPath: 'fabric-1.21.1', taskGroup: 'fabric-1.21.1'],
    neoforge121: [projectPath: 'neoforge-1.21.1', taskGroup: 'neoForge-1.21.1']
].each { prefix, loader ->
    def projectPath = loader.projectPath
    ['build', 'assemble', 'clean', 'runClient', 'runServer'].each { taskName ->
        tasks.register("${prefix}${taskName.capitalize()}") {
            group = loader.taskGroup
            description = "Runs ':${projectPath}:${taskName}' from the AntOS root project"
            dependsOn(":${projectPath}:${taskName}")
        }
    }
}

['26.1': '261', '26.2': '262', '26.3': '263'].each { version, suffix ->
    ['fabric', 'neoforge'].each { loader ->
        def prefix = "${loader}${suffix}"
        def projectPath = "${loader}-${version}"
        ['build', 'assemble', 'clean', 'runClient', 'runServer'].each { taskName ->
            tasks.register("${prefix}${taskName.capitalize()}") {
                group = "${loader}-${version}"
                description = "Runs ':${projectPath}:${taskName}' from the AntOS root project"
                dependsOn(":${projectPath}:${taskName}")
            }
        }
    }
}

def uiColorCheck = tasks.register('checkUiColors') {
    group = 'verification'
    description = 'Fails when AntOS interface code uses a color literal instead of a palette token from Ui'
    def sources = fileTree(projectDir) {
        include 'common-*/src/main/java/com/craisinlord/antos/content/client/**/*.java'
        exclude '**/content/client/palette/**'
        exclude '**/content/client/ComputerTheme.java'
    }
    def root = projectDir.toPath()
    inputs.files(sources)
    doLast {
        def offenders = []
        sources.each { file ->
            file.readLines('UTF-8').eachWithIndex { line, index ->
                if (line =~ /0x[0-9A-Fa-f]{8}\b(?!L)/ && !line.contains('value & 0x7FFFFFFF')) {
                    offenders << "${root.relativize(file.toPath())}:${index + 1}: ${line.trim()}"
                }
            }
        }
        if (!offenders.isEmpty()) {
            throw new GradleException('Hard-coded interface colors found. Use a palette token from Ui instead:\n' + offenders.join('\n'))
        }
    }
}

subprojects {
    tasks.matching { it.name == 'compileJava' }.configureEach { dependsOn(uiColorCheck) }
}

def deliveryArrivalTestClasses = layout.buildDirectory.dir('classes/java/deliveryArrivalTest')
tasks.register('compileDeliveryArrivalTests', JavaCompile) {
    source files(
            'common-1.21.1/src/main/java/com/craisinlord/antos/content/entity/DeliveryArrival.java',
            'common-1.21.1/src/test/java/com/craisinlord/antos/content/entity/DeliveryArrivalTest.java',
            'common-1.21.1/src/main/java/com/craisinlord/antos/content/client/renderer/DeliveryPortalGeometry.java',
            'common-1.21.1/src/test/java/com/craisinlord/antos/content/client/renderer/DeliveryPortalGeometryTest.java')
    classpath = files()
    destinationDirectory = deliveryArrivalTestClasses
    options.release = 21
}

tasks.register('deliveryArrivalTest', JavaExec) {
    group = 'verification'
    description = 'Verifies delivery placement under roofs, in cramped rooms, and near world limits.'
    dependsOn tasks.named('compileDeliveryArrivalTests')
    classpath = files(deliveryArrivalTestClasses)
    mainClass = 'com.craisinlord.antos.content.entity.DeliveryArrivalTest'
}

tasks.register('deliveryPortalGeometryTest', JavaExec) {
    group = 'verification'
    description = 'Verifies the ceiling portal mesh, clearance, coverage, and both visible faces.'
    dependsOn tasks.named('compileDeliveryArrivalTests')
    classpath = files(deliveryArrivalTestClasses)
    mainClass = 'com.craisinlord.antos.content.client.renderer.DeliveryPortalGeometryTest'
}

tasks.named('deliveryArrivalTest') { dependsOn tasks.named('deliveryPortalGeometryTest') }

def gameLogicMain = 'common-1.21.1/src/main/java'
def gameLogicTestRoot = 'common-1.21.1/src/test/java'
def gameLogicTestClasses = layout.buildDirectory.dir('classes/java/gameLogicTest')
def gameLogicTestSources = fileTree(gameLogicTestRoot) {
    include 'com/craisinlord/antos/content/client/game/logic/**/*Test.java'
    include 'com/craisinlord/antos/content/computer/games/*Test.java'
}
tasks.register('compileGameLogicTests', JavaCompile) {
    source fileTree(gameLogicMain) {
        include 'com/craisinlord/antos/content/client/game/logic/**/*.java'
        include 'com/craisinlord/antos/content/computer/games/GameDataCodec.java'
    }
    source fileTree(gameLogicTestRoot) {
        include 'com/craisinlord/antos/content/client/game/logic/**/*.java'
        include 'com/craisinlord/antos/content/computer/games/*Test.java'
    }
    classpath = files()
    destinationDirectory = gameLogicTestClasses
    options.release = 21
}

def gameLogicTestTasks = gameLogicTestSources.files.sort { it.path }.collect { testFile ->
    def className = file(gameLogicTestRoot).toPath().relativize(testFile.toPath()).toString().replace(File.separator, '.').replaceAll(/\.java$/, '')
    tasks.register("gameLogicTest${className.tokenize('.').last()}", JavaExec) {
        group = 'verification'
        dependsOn tasks.named('compileGameLogicTests')
        classpath = files(gameLogicTestClasses)
        mainClass = className
    }
}

tasks.register('gameLogicTests') {
    group = 'verification'
    description = 'Runs the pure-Java logic tests for the AntOS arcade games.'
    dependsOn gameLogicTestTasks
}
